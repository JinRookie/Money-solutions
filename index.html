<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1e88e5">
  <meta name="description" content="Offline-first personal finance operating system">
  <title>MoneyManager</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="app">
    <!-- App shell. Empty for now. Milestone 5 will populate this. -->
    <noscript>
      <p>MoneyManager requires JavaScript to function.</p>
    </noscript>
  </div>

  <!-- Temporary Debug Panel: Milestone 1 only. Removed in Milestone 5. -->
  <div id="debug-panel" style="display:none;">
    <h3>Debug</h3>
    <pre id="debug-output"></pre>
    <button id="debug-clear">Clear Storage</button>
  </div>
  <button id="debug-toggle" style="position:fixed;bottom:8px;left:50%;transform:translateX(-50%);z-index:9999;background:#1e88e5;color:#fff;padding:8px 16px;border-radius:8px;font-size:16px;box-shadow:0 4px 6px rgba(0,0,0,0.2);">🐛 DEBUG</button>

  <script> window.onerror = function (message, source, line, column, error) {   document.body.innerHTML = `     <div style="       background:#111;       color:#ff5555;       padding:20px;       font-family:monospace;       white-space:pre-wrap;       min-height:100vh;       box-sizing:border-box;     "> <h2>🚨 JavaScript Error</h2>  <b>Message:</b> ${message}  <b>Source:</b> ${source}  <b>Line:</b> ${line} <b>Column:</b> ${column}  <b>Stack:</b> ${error && error.stack ? error.stack : 'No stack available'}     </div>`; };  window.onunhandledrejection = function (event) {   document.body.innerHTML = `     <div style="       background:#111;       color:#ff5555;       padding:20px;       font-family:monospace;       white-space:pre-wrap;       min-height:100vh;       box-sizing:border-box;     "> <h2>🚨 Unhandled Promise Rejection</h2>  ${event.reason && event.reason.stack   ? event.reason.stack   : JSON.stringify(event.reason, null, 2)}     </div>`; }; </script>  <script type="module" src="js/app.js"></script>
</body>
</html>
